name: Bug report
description: Something isn't working as the acceptance criteria describe
title: "Bug: "
labels: ["type:bug"]
body:
  - type: input
    id: story
    attributes:
      label: Related story
      placeholder: "#13 US-13 · Submit a quote request"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Production / preview URL, browser, device"
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Critical, High, Medium, Low]
    validations:
      required: true
  - type: markdown
    attributes:
      value: "⚠️ Do not include passwords or customer personal data in this report."
